name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: asre_test
          POSTGRES_PASSWORD: asre_test
          POSTGRES_DB: asre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-redshift:
        image: postgres:15
        env:
          POSTGRES_USER: asre_test
          POSTGRES_PASSWORD: asre_test
          POSTGRES_DB: asre_test
          POSTGRES_HOST_AUTH_METHOD: md5
          POSTGRES_INITDB_ARGS: "--auth-host=md5"
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start BigQuery emulator
        run: |
          docker run -d --name bigquery-emulator \
            -p 9050:9050 \
            ghcr.io/goccy/bigquery-emulator:latest \
            --project=test --dataset=test
          # Wait for emulator to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9050/bigquery/v2/projects/test/datasets/test >/dev/null 2>&1; then
              echo "BigQuery emulator ready"
              break
            fi
            echo "Waiting for BigQuery emulator... ($i/30)"
            sleep 2
          done

      - name: Run typecheck
        run: |
          python -m mypy asre/ --strict

      - name: Security scan (dependency audit)
        run: |
          pip install pip-audit
          pip-audit --strict .

      - name: Security scan (SAST)
        run: |
          pip install bandit
          bandit -r asre/ -c pyproject.toml

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ -v --tb=short --cov=asre --cov-report=term-missing --cov-fail-under=80

      - name: Run integration tests
        env:
          ASRE_TEST_PG_HOST: localhost
          ASRE_TEST_PG_PORT: "5432"
          ASRE_TEST_PG_DATABASE: asre_test
          ASRE_TEST_PG_USER: asre_test
          ASRE_TEST_PG_PASSWORD: asre_test
          ASRE_TEST_PG_SCHEMA: public
          ASRE_TEST_BQ_PROJECT: test
          ASRE_TEST_BQ_DATASET: test
          ASRE_TEST_BQ_ENDPOINT: http://localhost:9050
          ASRE_TEST_RS_HOST: localhost
          ASRE_TEST_RS_PORT: "5434"
          ASRE_TEST_RS_DATABASE: asre_test
          ASRE_TEST_RS_USER: asre_test
          ASRE_TEST_RS_PASSWORD: asre_test
          ASRE_TEST_RS_SCHEMA: public
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Check snapshot diffs
        run: |
          python -m pytest tests/unit/ --snapshot-warn-unused
          git diff --exit-code tests/

  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: asre_test
          POSTGRES_PASSWORD: asre_test
          POSTGRES_DB: asre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: dbt compile
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
          ASRE_DB_HOST: localhost
          ASRE_DB_PORT: 5432
          ASRE_DB_USER: asre_test
          ASRE_DB_PASSWORD: asre_test
          ASRE_DB_NAME: asre_test
        run: |
          dbt compile --target dev

      - name: Bootstrap ASRE schema objects
        env:
          ASRE_DB_HOST: localhost
          ASRE_DB_PORT: 5432
          ASRE_DB_USER: asre_test
          ASRE_DB_PASSWORD: asre_test
          ASRE_DB_NAME: asre_test
        run: |
          python - <<'PY'
          import os
          from asre.ingest.postgres import PostgresAdapter
          from asre.migration.migrator import Migrator

          cfg = {
              "host": os.environ["ASRE_DB_HOST"],
              "port": os.environ["ASRE_DB_PORT"],
              "database": os.environ["ASRE_DB_NAME"],
              "user": os.environ["ASRE_DB_USER"],
              "password": os.environ["ASRE_DB_PASSWORD"],
              "schema": "public",
          }
          adapter = PostgresAdapter(cfg)
          adapter.connect()
          try:
              Migrator(adapter).run()
          finally:
              adapter.disconnect()
          PY

      - name: dbt test
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
          ASRE_DB_HOST: localhost
          ASRE_DB_PORT: 5432
          ASRE_DB_USER: asre_test
          ASRE_DB_PASSWORD: asre_test
          ASRE_DB_NAME: asre_test
        run: |
          dbt test --target dev

  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Embed license public key
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p asre/license
          echo "${{ secrets.ASRE_LICENSE_PUBLIC_KEY }}" > asre/license/public_key.pem

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/wbarakat/asre-engine:${{ github.ref_name }}
            ghcr.io/wbarakat/asre-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
