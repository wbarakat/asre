name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: asre_test
          POSTGRES_PASSWORD: asre_test
          POSTGRES_DB: asre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run typecheck
        run: |
          python -m mypy asre/ --strict

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://asre_test:asre_test@localhost:5432/asre_test
        run: |
          python -m pytest tests/integration/ -v --tb=short -m integration || true

      - name: Check snapshot diffs
        run: |
          python -m pytest tests/unit/ --snapshot-update --snapshot-warn-unused || true
          git diff --exit-code tests/ || echo "::warning::Snapshot changes detected - review before merging"

  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: asre_test
          POSTGRES_PASSWORD: asre_test
          POSTGRES_DB: asre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: dbt compile
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
          ASRE_DB_HOST: localhost
          ASRE_DB_PORT: 5432
          ASRE_DB_USER: asre_test
          ASRE_DB_PASSWORD: asre_test
          ASRE_DB_NAME: asre_test
        run: |
          dbt compile --target postgres || true

      - name: dbt test
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
          ASRE_DB_HOST: localhost
          ASRE_DB_PORT: 5432
          ASRE_DB_USER: asre_test
          ASRE_DB_PASSWORD: asre_test
          ASRE_DB_NAME: asre_test
        run: |
          dbt test --target postgres || true

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: asre-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
