[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asre"
version = "1.0.0"
description = "Admission Signal Reliability Engine - Healthcare data reliability layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "click>=8.0,<9.0",
    "rapidfuzz>=3.0,<4.0",
    "dbt-core>=1.7,<2.0",
    "dbt-postgres>=1.7,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "PyJWT>=2.8,<3.0",
    "cryptography>=44.0.1,<47.0",
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.0,<4.0",
    "dbt-snowflake>=1.7,<2.0",
]
bigquery = [
    "google-cloud-bigquery>=3.0,<4.0",
    "dbt-bigquery>=1.7,<2.0",
]
redshift = [
    "redshift-connector>=2.0,<3.0",
    "dbt-redshift>=1.7,<2.0",
]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "syrupy>=4.0,<5.0",
    "mypy>=1.0,<2.0",
    "types-PyYAML",
]

[project.scripts]
asre = "asre.cli.main:cli"

[tool.setuptools.packages.find]
include = ["asre*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "snowflake.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redshift_connector.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["asre"]
omit = [
    "asre/ingest/snowflake.py",
    "asre/ingest/bigquery.py",
    "asre/ingest/redshift.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
